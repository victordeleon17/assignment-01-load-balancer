name: Build & Push Docker Image

on:
  push:
    branches:
      - assignment-04
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Export Docker Hub creds from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          echo "DOCKERHUB_USERNAME=$(doppler secrets get DOCKERHUB_USERNAME --plain)" >> $GITHUB_ENV
          echo "DOCKERHUB_TOKEN=$(doppler secrets get DOCKERHUB_TOKEN --plain)" >> $GITHUB_ENV

      - name: Fail if creds missing
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ]; then echo "DOCKERHUB_USERNAME missing"; exit 1; fi
          if [ -z "${DOCKERHUB_TOKEN}" ]; then echo "DOCKERHUB_TOKEN missing"; exit 1; fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./assignment-04-app
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/focusflow:latest
            ${{ env.DOCKERHUB_USERNAME }}/focusflow:${{ github.sha }}
