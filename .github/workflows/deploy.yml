name: Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - assignment-03

env:
  APPLICATION_NAME: assignment-app
  ENVIRONMENT_NAME: Assignment-app-env
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1) DEBUG: muestra estructura y detecta dónde está el package.json
      - name: Show repo root files and detect app dir
        run: |
          echo "PWD (repo root):"
          pwd
          echo "ROOT FILES:"
          ls -la

          echo "---- find package.json ----"
          find . -maxdepth 4 -name package.json -print

          echo "---- find package-lock.json ----"
          find . -maxdepth 4 -name package-lock.json -print

          APP_DIR="$(dirname "$(find . -maxdepth 4 -name package.json -print -quit)")"
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          echo "Detected APP_DIR: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV

      # 2) Instala dependencias en la carpeta detectada
      - name: Install dependencies
        run: |
          cd "$APP_DIR"
          npm ci

      - name: Run Lint
        run: |
          cd "$APP_DIR"
          npm run lint

      - name: Build project
        run: |
          cd "$APP_DIR"
          npm run build

      # 3) Build Docker (desde la carpeta donde está el Dockerfile del proyecto)
      - name: Build Docker image
        run: |
          cd "$APP_DIR"
          docker build -t assignment-app:${{ github.sha }} .

      # 4) Crear deploy.zip en la RAÍZ del repo (fuera de APP_DIR)
      - name: Create deployment package
        run: |
          cd "$APP_DIR"
          zip -r "$GITHUB_WORKSPACE/deploy.zip" . -x "node_modules/*" "dist/*" ".git/*"

      # 5) AWS creds
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 6) Deploy a Elastic Beanstalk
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: ${{ env.AWS_REGION }}
          application_name: ${{ env.APPLICATION_NAME }}
          environment_name: ${{ env.ENVIRONMENT_NAME }}
          version_label: assignment-${{ github.sha }}
          deployment_package: deploy.zip