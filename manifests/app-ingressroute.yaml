apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-ingressroute
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`app.victor-deleon.com`)
      kind: Rule
      services:
        - name: web1-service
          port: 80
          weight: 1
        - name: web2-service
          port: 80
          weight: 1
