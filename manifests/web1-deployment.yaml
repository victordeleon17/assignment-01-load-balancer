apiVersion: apps/v1
kind: Deployment
metadata:
  name: web1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web1
  template:
    metadata:
      labels:
        app: web1
    spec:
      containers:
        - name: web1
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: web1-html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: web1-html
          configMap:
            name: web1-html
